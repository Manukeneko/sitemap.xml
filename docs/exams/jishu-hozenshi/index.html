<script type="application/json" id="quiz-data">{"slug":"jishu-hozenshi","title":"自主保全士検定 練習問題","shortTitle":"自主保全士検定","description":"TPM(全社的生産保全)の基礎知識を問う自主保全士検定の練習問題です。5S・自主保全7ステップ・ロス構造など頻出テーマを無料で腕試しできます。","category":"製造・生産管理","accentColor":"#39ff88","questions":[{"q":"自主保全活動における「7つのステップ」で、最初に行うステップはどれですか。","choices":["初期清掃","発生源・困難個所対策","自主保全仮基準の作成","総点検"],"answer":0,"explanation":"自主保全7ステップの第1ステップは「初期清掃」で、設備の汚れ・微欠陥を発見し除去することから始まります。"},{"q":"「5S」に含まれないものはどれですか。","choices":["整理","整頓","清掃","統制"],"answer":3,"explanation":"5Sは「整理・整頓・清掃・清潔・しつけ」の5つで、「統制」は含まれません。"},{"q":"設備の6大ロスのうち、段取り替えや調整によって生じるロスを何と呼びますか。","choices":["速度低下ロス","段取り・調整ロス","初期流動管理ロス","工具交換ロス"],"answer":1,"explanation":"段取り替え作業や調整に時間を要することで発生する停止ロスを「段取り・調整ロス」と呼びます。"},{"q":"自主保全活動における「発生源対策」の主な目的は何ですか。","choices":["汚れの発生元そのものを絶つ、または飛散を防止すること","清掃の担当者を増やすこと","点検周期を長くすること","設備を新しいものに交換すること"],"answer":0,"explanation":"発生源対策は、汚れ・異物などの発生源を根本から絶つ、または飛散・拡散を防止し、清掃時間そのものを削減することが目的です。"},{"q":"「MTBF」の説明として正しいものはどれですか。","choices":["平均故障間隔(Mean Time Between Failures)","平均修復時間(Mean Time To Repair)","総合設備効率の略称","月間生産計画の略称"],"answer":0,"explanation":"MTBFはMean Time Between Failuresの略で、故障から次の故障までの平均時間を示す保全指標です。"},{"q":"OEE(総合設備効率)の計算に用いられない要素はどれですか。","choices":["時間稼働率","性能稼働率","良品率","従業員満足度"],"answer":3,"explanation":"OEEは「時間稼働率 × 性能稼働率 × 良品率」で算出され、従業員満足度は含まれません。"},{"q":"自主保全ステップの中で「基準づくり」を行うのは第何ステップですか。","choices":["第2ステップ","第3ステップ","第4ステップ","第5ステップ"],"answer":1,"explanation":"第3ステップで、清掃・給油・増締めを短時間で行うための「自主保全仮基準」を作成します。"},{"q":"TPMにおける「予知保全」の説明として最も適切なものはどれですか。","choices":["設備の状態を診断・監視し、故障の兆候を捉えてから対処する保全方式","故障してから修理を行う保全方式","一定周期で部品を交換する保全方式","運転員が一切保全に関与しない保全方式"],"answer":0,"explanation":"予知保全(状態基準保全)は振動・温度などの状態監視データから劣化傾向を把握し、故障前に対処する方式です。"},{"q":"自主保全活動で「総点検」を行う目的として適切なものはどれですか。","choices":["点検作業員に設備知識を学ばせ、微欠陥を発見できるようにすること","点検記録を廃止すること","清掃作業を完全になくすこと","生産数量を増やすこと"],"answer":0,"explanation":"総点検(第4ステップ)では運転員自身が点検方法を学び、目で見て微欠陥を発見できる能力を身につけます。"},{"q":"「なぜなぜ分析」の目的として最も適切なものはどれですか。","choices":["表面的な現象ではなく真因を突き止めること","作業者の責任を追及すること","設備コストを削減すること","生産計画を立てること"],"answer":0,"explanation":"「なぜ」を繰り返し問うことで、問題の真因(根本原因)にたどり着き、再発防止策につなげる分析手法です。"}]}</script>
